name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.95.0
  FFMPEG_RELEASE: autobuild-2026-07-31-14-10
  FFMPEG_ARCHIVE: ffmpeg-n8.1.2-34-g9b6c8969e0-win64-gpl-8.1.zip
  FFMPEG_SHA256: cc4156d51387566ea8ba653fc3a04897bdf812fddf652428d9030bbf7ae24835

jobs:
  web:
    name: Viewer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build the viewer
        run: |
          npm ci --prefix web
          npm --prefix web test
          npm --prefix web run build

      - name: Upload the viewer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows build
    needs: web
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the viewer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-web-dist
          path: web/dist

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy --component rustfmt
          rustup default $env:RUST_VERSION

      - name: Set up test FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $download = Join-Path $env:RUNNER_TEMP "ffmpeg-download"
          $extracted = Join-Path $env:RUNNER_TEMP "ffmpeg-extracted"
          New-Item -ItemType Directory -Force -Path $download | Out-Null
          gh release download $env:FFMPEG_RELEASE --repo BtbN/FFmpeg-Builds --pattern $env:FFMPEG_ARCHIVE --dir $download
          $archive = Join-Path $download $env:FFMPEG_ARCHIVE
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:FFMPEG_SHA256) {
            throw "FFmpeg checksum mismatch: expected $env:FFMPEG_SHA256, got $actual"
          }
          Expand-Archive $archive -DestinationPath $extracted
          $ffmpeg = Get-ChildItem $extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found in $env:FFMPEG_ARCHIVE"
          }
          $ffmpeg.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check and test Rust
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all -- --check
          cargo clippy --locked -- -D clippy::correctness -D clippy::suspicious
          cargo test --locked

  linux:
    name: Linux build
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the viewer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-web-dist
          path: web/dist

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev libclang-dev libdbus-1-dev libegl-dev libgbm-dev \
            libpipewire-0.3-dev libssl-dev libudev-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb1-dev libxkbcommon-dev libxrandr-dev pkg-config

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Build Linux
        run: cargo build --locked
