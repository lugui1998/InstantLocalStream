name: Release v1.0.0

on:
  push:
    tags:
      - v1.0.0

permissions:
  actions: read
  contents: read

concurrency:
  group: release-v1.0.0
  cancel-in-progress: false

env:
  RELEASE_VERSION: 1.0.0
  RUST_VERSION: 1.95.0
  FFMPEG_RELEASE: autobuild-2026-08-29-13-12
  FFMPEG_REVISION: n8.1.2-50-g1a748fe2cd
  APPIMAGETOOL_RELEASE: 1.9.1
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_RELEASE: 20251108
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  LINUXDEPLOY_RELEASE: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  PIPEWIRE_VERSION: 1.0.5
  PIPEWIRE_COMMIT: a2287be601710eea0d073261223ec34b92384c8a

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and manifest versions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/v${RELEASE_VERSION}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "instant-local-stream") | .version')" = "$RELEASE_VERSION"
          test "$(jq -r '.version' web/package.json)" = "$RELEASE_VERSION"
          test "$(jq -r '.version' web/package-lock.json)" = "$RELEASE_VERSION"
          test "$(jq -r '.packages[""].version' web/package-lock.json)" = "$RELEASE_VERSION"
          test -s LICENSE
          test "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "instant-local-stream") | .license')" = "PolyForm-Noncommercial-1.0.0"
          test -s THIRD_PARTY_NOTICES.md
          test -s packaging/THIRD_PARTY_LICENSES-RUST.txt
          test -s packaging/THIRD_PARTY_LICENSES-NPM.txt
          test -s packaging/RELEASE_NOTES_v1.0.0.md

      - name: Require successful main CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion')"
          test "$conclusion" = "success"

  web:
    name: Build viewer
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the viewer
        run: bash scripts/build-web.sh

      - name: Upload the viewer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows x86-64
    needs: web
    runs-on: windows-2022
    env:
      FFMPEG_ARCHIVE: ffmpeg-n8.1.2-50-g1a748fe2cd-win64-gpl-8.1.zip
      FFMPEG_SHA256: 3b56a6e46944cbe87692a4a72b29d95e527cbbd9925fc7beb07bb63d578cd5ae
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the viewer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-dist
          path: web/dist

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Download and verify FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          gh release download $env:FFMPEG_RELEASE --repo BtbN/FFmpeg-Builds --pattern $env:FFMPEG_ARCHIVE --dir ffmpeg-download
          $expected = $env:FFMPEG_SHA256.ToLowerInvariant()
          $actual = (Get-FileHash "ffmpeg-download/$env:FFMPEG_ARCHIVE" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "FFmpeg checksum mismatch: expected $expected, got $actual"
          }
          Expand-Archive "ffmpeg-download/$env:FFMPEG_ARCHIVE" -DestinationPath ffmpeg-download/extracted

      - name: Test and build the portable executable
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ffmpeg = Get-ChildItem ffmpeg-download/extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found in $env:FFMPEG_ARCHIVE"
          }
          $ffmpegLicense = Get-ChildItem ffmpeg-download/extracted -Filter LICENSE.txt -Recurse | Select-Object -First 1
          if (-not $ffmpegLicense) {
            throw "FFmpeg LICENSE.txt was not found in $env:FFMPEG_ARCHIVE"
          }
          $encoders = (& $ffmpeg.FullName -hide_banner -encoders 2>&1 | Out-String)
          foreach ($encoder in @("libvpx", "libvpx-vp9", "libx264")) {
            if ($encoders -notmatch "(?m)^\s*[A-Z\.]{6}\s+$([regex]::Escape($encoder))\s") {
              throw "Required FFmpeg encoder is missing: $encoder"
            }
          }
          ./scripts/build-portable.ps1 -FfmpegPath $ffmpeg.FullName -FfmpegLicensePath $ffmpegLicense.FullName -UsePrebuiltWeb
          Move-Item dist/Instant-Local-Stream.exe dist/Instant-Local-Stream-windows-x86_64.exe
          if ((Get-Item dist/Instant-Local-Stream-windows-x86_64.exe).Length -le 0) {
            throw "Windows release artifact is empty"
          }
          ./scripts/verify-windows-icon.ps1 -ExePath dist/Instant-Local-Stream-windows-x86_64.exe
          $stdoutPath = Join-Path $env:RUNNER_TEMP "instant-local-stream-validate.json"
          $stderrPath = Join-Path $env:RUNNER_TEMP "instant-local-stream-validate.stderr"
          $processArguments = @{
            FilePath = (Resolve-Path dist/Instant-Local-Stream-windows-x86_64.exe)
            ArgumentList = @("validate", "--json", "--source", "test:0")
            Wait = $true
            PassThru = $true
            RedirectStandardOutput = $stdoutPath
            RedirectStandardError = $stderrPath
          }
          $process = Start-Process @processArguments
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows validation failed: $(Get-Content $stderrPath -Raw)"
          }
          $validation = Get-Content $stdoutPath -Raw | ConvertFrom-Json
          if (-not $validation.ok -or -not $validation.ffmpeg.available -or $validation.ffmpeg.command -ne "embedded FFmpeg") {
            throw "Packaged Windows validation did not use embedded FFmpeg: $(Get-Content $stdoutPath -Raw)"
          }
          $licenseOutput = Join-Path $env:RUNNER_TEMP "instant-local-stream-licenses"
          $licenseProcessArguments = @{
            FilePath = (Resolve-Path dist/Instant-Local-Stream-windows-x86_64.exe)
            ArgumentList = @("licenses", "--output", $licenseOutput)
            Wait = $true
            PassThru = $true
          }
          $licenseProcess = Start-Process @licenseProcessArguments
          if ($licenseProcess.ExitCode -ne 0) {
            throw "Packaged Windows license extraction failed"
          }
          foreach ($name in @("LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES-RUST.txt", "THIRD_PARTY_LICENSES-NPM.txt", "FFMPEG_SOURCE_OFFER.md", "FFMPEG-LICENSE.txt")) {
            if (-not (Test-Path -LiteralPath (Join-Path $licenseOutput $name) -PathType Leaf)) {
              throw "Packaged Windows license file is missing: $name"
            }
          }
          $expectedLicenseHash = (Get-FileHash $ffmpegLicense.FullName -Algorithm SHA256).Hash
          $actualLicenseHash = (Get-FileHash (Join-Path $licenseOutput "FFMPEG-LICENSE.txt") -Algorithm SHA256).Hash
          if ($actualLicenseHash -ne $expectedLicenseHash) {
            throw "Packaged Windows FFmpeg license does not match its embedded FFmpeg archive"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64
          path: dist/Instant-Local-Stream-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux x86-64
    needs: web
    runs-on: ubuntu-22.04
    env:
      FFMPEG_ARCHIVE: ffmpeg-n8.1.2-50-g1a748fe2cd-linux64-gpl-8.1.tar.xz
      FFMPEG_SHA256: be243f2520d6e7e92c82b015ed72a3f5b57c7970801c0d51f031457122653c76
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libglib2.0-dev \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl-dev \
            libgbm-dev \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            meson \
            ninja-build \
            pkg-config

      - name: Check out PipeWire source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PipeWire/pipewire
          ref: ${{ env.PIPEWIRE_COMMIT }}
          path: pipewire-source
          persist-credentials: false

      - name: Build the pinned PipeWire runtime
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/pipewire-prefix"
          meson setup pipewire-build pipewire-source \
            --prefix "$prefix" \
            --libdir lib \
            --buildtype release \
            -Ddefault_library=shared \
            -Dauto_features=disabled \
            -Ddocs=disabled \
            -Dman=disabled \
            -Dexamples=disabled \
            -Dtests=disabled \
            -Dinstalled_tests=disabled \
            -Dsession-managers=[] \
            -Dpipewire-jack=disabled \
            -Dpipewire-v4l2=disabled \
            -Ddbus=disabled \
            -Dflatpak=disabled \
            -Dsystemd=disabled \
            -Dsystemd-user-service=disabled \
            -Dlegacy-rtkit=false \
            -Drlimits-install=false \
            -Dspa-plugins=enabled \
            -Dalsa=disabled
          meson compile -C pipewire-build
          meson install -C pipewire-build
          install -Dm0644 pipewire-source/COPYING "$prefix/share/doc/pipewire/COPYING"
          pipewire_pkgconfig_dir="$(find "$prefix" -path '*/pkgconfig/libpipewire-0.3.pc' -printf '%h\n' -quit)"
          test -n "$pipewire_pkgconfig_dir"
          export PKG_CONFIG_PATH="$pipewire_pkgconfig_dir${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          test "$(pkg-config --modversion libpipewire-0.3)" = "$PIPEWIRE_VERSION"
          test "$(pkg-config --variable=prefix libpipewire-0.3)" = "$prefix"
          pipewire_libdir="$(pkg-config --variable=libdir libpipewire-0.3)"
          test -d "$pipewire_libdir/pipewire-0.3"
          test -d "$pipewire_libdir/spa-0.2"
          test -d "$prefix/share/pipewire"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$pipewire_libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Download the viewer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-dist
          path: web/dist

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Download and verify FFmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ffmpeg-download/extracted
          gh release download "$FFMPEG_RELEASE" --repo BtbN/FFmpeg-Builds --pattern "$FFMPEG_ARCHIVE" --dir ffmpeg-download
          echo "$FFMPEG_SHA256  ffmpeg-download/$FFMPEG_ARCHIVE" | sha256sum --check --strict
          tar -xJf "ffmpeg-download/$FFMPEG_ARCHIVE" -C ffmpeg-download/extracted

      - name: Install AppImage packaging tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/appimage-runtime" "$RUNNER_TEMP/linuxdeploy" "$RUNNER_TEMP/bin"
          gh release download "$APPIMAGETOOL_RELEASE" --repo AppImage/appimagetool --pattern appimagetool-x86_64.AppImage --dir "$RUNNER_TEMP/appimagetool"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool/appimagetool-x86_64.AppImage" | sha256sum --check --strict
          gh release download "$APPIMAGE_RUNTIME_RELEASE" --repo AppImage/type2-runtime --pattern runtime-x86_64 --dir "$RUNNER_TEMP/appimage-runtime"
          echo "$APPIMAGE_RUNTIME_SHA256  $RUNNER_TEMP/appimage-runtime/runtime-x86_64" | sha256sum --check --strict
          gh release download "$LINUXDEPLOY_RELEASE" --repo linuxdeploy/linuxdeploy --pattern linuxdeploy-x86_64.AppImage --dir "$RUNNER_TEMP/linuxdeploy"
          echo "$LINUXDEPLOY_SHA256  $RUNNER_TEMP/linuxdeploy/linuxdeploy-x86_64.AppImage" | sha256sum --check --strict
          install -m 0755 "$RUNNER_TEMP/appimagetool/appimagetool-x86_64.AppImage" "$RUNNER_TEMP/bin/appimagetool"
          install -m 0755 "$RUNNER_TEMP/linuxdeploy/linuxdeploy-x86_64.AppImage" "$RUNNER_TEMP/bin/linuxdeploy"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "APPIMAGETOOL_RUNTIME_FILE=$RUNNER_TEMP/appimage-runtime/runtime-x86_64" >> "$GITHUB_ENV"

      - name: Test and build the AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          ffmpeg_path="$(find ffmpeg-download/extracted -type f -path '*/bin/ffmpeg' -print -quit)"
          ffmpeg_license="$(find ffmpeg-download/extracted -type f -name LICENSE.txt -print -quit)"
          test -n "$ffmpeg_path"
          test -n "$ffmpeg_license"
          encoders="$($ffmpeg_path -hide_banner -encoders 2>&1)"
          for encoder in libvpx libvpx-vp9 libx264; do
            grep -Eq "[[:space:]]${encoder}[[:space:]]" <<<"$encoders"
          done
          bash scripts/build-portable.sh "$ffmpeg_path" "$ffmpeg_license" --use-prebuilt-web
          test -s dist/Instant-Local-Stream-linux-x86_64.AppImage
          license_output="$(mktemp -d)"
          dist/Instant-Local-Stream-linux-x86_64.AppImage licenses --output "$license_output"
          for name in LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES-RUST.txt THIRD_PARTY_LICENSES-NPM.txt FFMPEG_SOURCE_OFFER.md FFMPEG-LICENSE.txt; do
            test -s "$license_output/$name"
          done
          cmp "$ffmpeg_license" "$license_output/FFMPEG-LICENSE.txt"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: dist/Instant-Local-Stream-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  linux-smoke:
    name: Smoke-test Linux AppImage
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-x86_64
          path: release-linux

      - name: Validate the packaged AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          chmod +x release-linux/Instant-Local-Stream-linux-x86_64.AppImage
          output="$(release-linux/Instant-Local-Stream-linux-x86_64.AppImage version)"
          test "$output" = "instant-local-stream $RELEASE_VERSION"
          validation="$(release-linux/Instant-Local-Stream-linux-x86_64.AppImage validate --json --source test:0)"
          jq -e '.ok == true and .ffmpeg.available == true and .ffmpeg.command == "embedded FFmpeg"' <<<"$validation"

  release:
    name: Publish GitHub release
    needs:
      - windows
      - linux-smoke
    runs-on: ubuntu-24.04
    environment: v1-release
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-x86_64
          path: release-windows

      - name: Download Linux release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-x86_64
          path: release-linux

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp release-windows/Instant-Local-Stream-windows-x86_64.exe release/
          cp release-linux/Instant-Local-Stream-linux-x86_64.AppImage release/

      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_files=(
            release/Instant-Local-Stream-windows-x86_64.exe
            release/Instant-Local-Stream-linux-x86_64.AppImage
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true"
            gh release edit "$GITHUB_REF_NAME" \
              --title "Instant Local Stream $GITHUB_REF_NAME" \
              --notes-file packaging/RELEASE_NOTES_v1.0.0.md
            for file in "${release_files[@]}"; do
              asset="$(basename "$file")"
              if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
              fi
            done
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}"
            existing_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            while IFS= read -r asset; do
              case "$asset" in
                Instant-Local-Stream-windows-x86_64.exe|Instant-Local-Stream-linux-x86_64.AppImage) ;;
                *) gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes ;;
              esac
            done <<<"$existing_assets"
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
              --verify-tag \
              --draft \
              --notes-file packaging/RELEASE_NOTES_v1.0.0.md \
              --title "Instant Local Stream $GITHUB_REF_NAME"
          fi
          expected_assets="$(printf '%s\n' \
            Instant-Local-Stream-linux-x86_64.AppImage \
            Instant-Local-Stream-windows-x86_64.exe)"
          actual_assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)"
          test "$actual_assets" = "$expected_assets"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
