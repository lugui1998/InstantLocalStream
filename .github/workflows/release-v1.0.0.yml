name: Release v1.0.0

on:
  push:
    tags:
      - v1.0.0

permissions:
  contents: read

concurrency:
  group: release-v1.0.0
  cancel-in-progress: false

env:
  RELEASE_VERSION: 1.0.0
  RUST_VERSION: 1.95.0
  FFMPEG_RELEASE: autobuild-2026-08-29-13-12
  FFMPEG_REVISION: n8.1.2-50-g1a748fe2cd
  APPIMAGETOOL_RELEASE: 1.9.1
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_RELEASE: 20251108
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  LINUXDEPLOY_RELEASE: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Verify tag and manifest versions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/v${RELEASE_VERSION}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "instant-local-stream") | .version')" = "$RELEASE_VERSION"
          test "$(node -p "require('./web/package.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./web/package-lock.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./web/package-lock.json').packages[''].version")" = "$RELEASE_VERSION"
          test -s LICENSE
          test "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "instant-local-stream") | .license')" = "PolyForm-Noncommercial-1.0.0"
          test -s THIRD_PARTY_NOTICES.md
          test -s packaging/THIRD_PARTY_LICENSES-RUST.txt
          test -s packaging/THIRD_PARTY_LICENSES-NPM.txt
          test -s packaging/RELEASE_NOTES_v1.0.0.md
          ! grep -Eiq 'must be recorded|before publishing|placeholder|TODO' THIRD_PARTY_NOTICES.md

      - name: Verify formatting and frontend tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          npm ci --prefix web
          npm --prefix web test

  windows:
    name: Build Windows x86-64
    needs: validate
    runs-on: windows-2022
    env:
      FFMPEG_ARCHIVE: ffmpeg-n8.1.2-50-g1a748fe2cd-win64-gpl-8.1.zip
      FFMPEG_SHA256: 3b56a6e46944cbe87692a4a72b29d95e527cbbd9925fc7beb07bb63d578cd5ae
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION

      - name: Download and verify FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          gh release download $env:FFMPEG_RELEASE --repo BtbN/FFmpeg-Builds --pattern $env:FFMPEG_ARCHIVE --dir ffmpeg-download
          $expected = $env:FFMPEG_SHA256.ToLowerInvariant()
          $actual = (Get-FileHash "ffmpeg-download/$env:FFMPEG_ARCHIVE" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "FFmpeg checksum mismatch: expected $expected, got $actual"
          }
          Expand-Archive "ffmpeg-download/$env:FFMPEG_ARCHIVE" -DestinationPath ffmpeg-download/extracted

      - name: Test and build the portable executable
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/build-web.ps1
          cargo test --locked
          $ffmpeg = Get-ChildItem ffmpeg-download/extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found in $env:FFMPEG_ARCHIVE"
          }
          $ffmpegLicense = Get-ChildItem ffmpeg-download/extracted -Filter LICENSE.txt -Recurse | Select-Object -First 1
          if (-not $ffmpegLicense) {
            throw "FFmpeg LICENSE.txt was not found in $env:FFMPEG_ARCHIVE"
          }
          $encoders = (& $ffmpeg.FullName -hide_banner -encoders 2>&1 | Out-String)
          foreach ($encoder in @("libvpx", "libvpx-vp9", "libx264")) {
            if ($encoders -notmatch "(?m)^\s*[A-Z\.]{6}\s+$([regex]::Escape($encoder))\s") {
              throw "Required FFmpeg encoder is missing: $encoder"
            }
          }
          ./scripts/build-portable.ps1 -FfmpegPath $ffmpeg.FullName
          Move-Item dist/Instant-Local-Stream.exe dist/Instant-Local-Stream-windows-x86_64.exe
          Copy-Item $ffmpegLicense.FullName dist/FFMPEG-LICENSE-windows-x86_64.txt
          @(
            "Provider: https://github.com/BtbN/FFmpeg-Builds"
            "Release: $env:FFMPEG_RELEASE"
            "Revision: $env:FFMPEG_REVISION"
            "Archive: $env:FFMPEG_ARCHIVE"
            "Variant: Windows x86-64 GPL static"
            ""
          ) | Set-Content dist/Instant-Local-Stream-windows-x86_64.ffmpeg.txt
          & $ffmpeg.FullName -version 2>&1 | Add-Content dist/Instant-Local-Stream-windows-x86_64.ffmpeg.txt
          if ((Get-Item dist/Instant-Local-Stream-windows-x86_64.exe).Length -le 0) {
            throw "Windows release artifact is empty"
          }
          ./scripts/verify-windows-icon.ps1 -ExePath dist/Instant-Local-Stream-windows-x86_64.exe
          $stdoutPath = Join-Path $env:RUNNER_TEMP "instant-local-stream-validate.json"
          $stderrPath = Join-Path $env:RUNNER_TEMP "instant-local-stream-validate.stderr"
          $processArguments = @{
            FilePath = (Resolve-Path dist/Instant-Local-Stream-windows-x86_64.exe)
            ArgumentList = @("validate", "--json", "--source", "test:0")
            Wait = $true
            PassThru = $true
            RedirectStandardOutput = $stdoutPath
            RedirectStandardError = $stderrPath
          }
          $process = Start-Process @processArguments
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows validation failed: $(Get-Content $stderrPath -Raw)"
          }
          $validation = Get-Content $stdoutPath -Raw | ConvertFrom-Json
          if (-not $validation.ok -or -not $validation.ffmpeg.available -or $validation.ffmpeg.command -ne "embedded FFmpeg") {
            throw "Packaged Windows validation did not use embedded FFmpeg: $(Get-Content $stdoutPath -Raw)"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-x86_64
          path: |
            dist/Instant-Local-Stream-windows-x86_64.exe
            dist/Instant-Local-Stream-windows-x86_64.ffmpeg.txt
            dist/FFMPEG-LICENSE-windows-x86_64.txt
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux x86-64
    needs: validate
    runs-on: ubuntu-22.04
    env:
      FFMPEG_ARCHIVE: ffmpeg-n8.1.2-50-g1a748fe2cd-linux64-gpl-8.1.tar.xz
      FFMPEG_SHA256: be243f2520d6e7e92c82b015ed72a3f5b57c7970801c0d51f031457122653c76
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libclang-dev \
            libdbus-1-dev \
            libegl-dev \
            libpipewire-0.3-dev \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Download and verify FFmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ffmpeg-download/extracted
          gh release download "$FFMPEG_RELEASE" --repo BtbN/FFmpeg-Builds --pattern "$FFMPEG_ARCHIVE" --dir ffmpeg-download
          echo "$FFMPEG_SHA256  ffmpeg-download/$FFMPEG_ARCHIVE" | sha256sum --check --strict
          tar -xJf "ffmpeg-download/$FFMPEG_ARCHIVE" -C ffmpeg-download/extracted

      - name: Install AppImage packaging tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/appimage-runtime" "$RUNNER_TEMP/linuxdeploy" "$RUNNER_TEMP/bin"
          gh release download "$APPIMAGETOOL_RELEASE" --repo AppImage/appimagetool --pattern appimagetool-x86_64.AppImage --dir "$RUNNER_TEMP/appimagetool"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool/appimagetool-x86_64.AppImage" | sha256sum --check --strict
          gh release download "$APPIMAGE_RUNTIME_RELEASE" --repo AppImage/type2-runtime --pattern runtime-x86_64 --dir "$RUNNER_TEMP/appimage-runtime"
          echo "$APPIMAGE_RUNTIME_SHA256  $RUNNER_TEMP/appimage-runtime/runtime-x86_64" | sha256sum --check --strict
          gh release download "$LINUXDEPLOY_RELEASE" --repo linuxdeploy/linuxdeploy --pattern linuxdeploy-x86_64.AppImage --dir "$RUNNER_TEMP/linuxdeploy"
          echo "$LINUXDEPLOY_SHA256  $RUNNER_TEMP/linuxdeploy/linuxdeploy-x86_64.AppImage" | sha256sum --check --strict
          install -m 0755 "$RUNNER_TEMP/appimagetool/appimagetool-x86_64.AppImage" "$RUNNER_TEMP/bin/appimagetool"
          install -m 0755 "$RUNNER_TEMP/linuxdeploy/linuxdeploy-x86_64.AppImage" "$RUNNER_TEMP/bin/linuxdeploy"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "APPIMAGETOOL_RUNTIME_FILE=$RUNNER_TEMP/appimage-runtime/runtime-x86_64" >> "$GITHUB_ENV"

      - name: Test and build the AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          bash scripts/build-web.sh
          npm --prefix web test
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked
          ffmpeg_path="$(find ffmpeg-download/extracted -type f -path '*/bin/ffmpeg' -print -quit)"
          ffmpeg_license="$(find ffmpeg-download/extracted -type f -name LICENSE.txt -print -quit)"
          test -n "$ffmpeg_path"
          test -n "$ffmpeg_license"
          encoders="$($ffmpeg_path -hide_banner -encoders 2>&1)"
          for encoder in libvpx libvpx-vp9 libx264; do
            grep -Eq "[[:space:]]${encoder}[[:space:]]" <<<"$encoders"
          done
          bash scripts/build-portable.sh "$ffmpeg_path" "$ffmpeg_license"
          test -s dist/Instant-Local-Stream-linux-x86_64.AppImage
          cp "$ffmpeg_license" dist/FFMPEG-LICENSE-linux-x86_64.txt
          {
            echo "Provider: https://github.com/BtbN/FFmpeg-Builds"
            echo "Release: $FFMPEG_RELEASE"
            echo "Revision: $FFMPEG_REVISION"
            echo "Archive: $FFMPEG_ARCHIVE"
            echo "Variant: Linux x86-64 GPL static"
            echo
            "$ffmpeg_path" -version
          } > dist/Instant-Local-Stream-linux-x86_64.ffmpeg.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-x86_64
          path: |
            dist/Instant-Local-Stream-linux-x86_64.AppImage
            dist/Instant-Local-Stream-linux-x86_64.ffmpeg.txt
            dist/FFMPEG-LICENSE-linux-x86_64.txt
          if-no-files-found: error
          retention-days: 7

  linux-smoke:
    name: Smoke-test Linux AppImage
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-x86_64
          path: release-linux

      - name: Validate the packaged AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          chmod +x release-linux/Instant-Local-Stream-linux-x86_64.AppImage
          output="$(release-linux/Instant-Local-Stream-linux-x86_64.AppImage version)"
          test "$output" = "instant-local-stream $RELEASE_VERSION"
          validation="$(release-linux/Instant-Local-Stream-linux-x86_64.AppImage validate --json --source test:0)"
          jq -e '.ok == true and .ffmpeg.available == true and .ffmpeg.command == "embedded FFmpeg"' <<<"$validation"

  release:
    name: Publish GitHub release
    needs:
      - windows
      - linux-smoke
    runs-on: ubuntu-22.04
    environment: v1-release
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download Windows release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows-x86_64
          path: release-windows

      - name: Download Linux release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-linux-x86_64
          path: release-linux

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release windows-package
          cp release-windows/Instant-Local-Stream-windows-x86_64.exe windows-package/Instant-Local-Stream.exe
          cp release-windows/Instant-Local-Stream-windows-x86_64.ffmpeg.txt windows-package/
          cp release-windows/FFMPEG-LICENSE-windows-x86_64.txt windows-package/FFMPEG-LICENSE.txt
          cp THIRD_PARTY_NOTICES.md windows-package/THIRD_PARTY_NOTICES.md
          cp packaging/THIRD_PARTY_LICENSES-RUST.txt windows-package/THIRD_PARTY_LICENSES-RUST.txt
          cp packaging/THIRD_PARTY_LICENSES-NPM.txt windows-package/THIRD_PARTY_LICENSES-NPM.txt
          cp packaging/FFMPEG_SOURCE_OFFER.md windows-package/FFMPEG_SOURCE_OFFER.md
          cp LICENSE windows-package/LICENSE
          (
            cd windows-package
            zip -9 -r ../release/Instant-Local-Stream-windows-x86_64.zip .
          )
          expected_windows_files=(
            FFMPEG-LICENSE.txt
            FFMPEG_SOURCE_OFFER.md
            Instant-Local-Stream-windows-x86_64.ffmpeg.txt
            Instant-Local-Stream.exe
            LICENSE
            THIRD_PARTY_LICENSES-NPM.txt
            THIRD_PARTY_LICENSES-RUST.txt
            THIRD_PARTY_NOTICES.md
          )
          test "$(unzip -Z1 release/Instant-Local-Stream-windows-x86_64.zip | wc -l)" -eq "${#expected_windows_files[@]}"
          for expected in "${expected_windows_files[@]}"; do
            unzip -Z1 release/Instant-Local-Stream-windows-x86_64.zip | grep -Fxq "$expected"
          done
          cp release-windows/Instant-Local-Stream-windows-x86_64.ffmpeg.txt release/
          cp release-windows/FFMPEG-LICENSE-windows-x86_64.txt release/
          cp release-linux/Instant-Local-Stream-linux-x86_64.AppImage release/
          cp release-linux/Instant-Local-Stream-linux-x86_64.ffmpeg.txt release/
          cp release-linux/FFMPEG-LICENSE-linux-x86_64.txt release/
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          cp packaging/THIRD_PARTY_LICENSES-RUST.txt release/THIRD_PARTY_LICENSES-RUST.txt
          cp packaging/THIRD_PARTY_LICENSES-NPM.txt release/THIRD_PARTY_LICENSES-NPM.txt
          cp packaging/FFMPEG_SOURCE_OFFER.md release/FFMPEG_SOURCE_OFFER.md
          cp LICENSE release/LICENSE
          cp Cargo.lock release/Cargo.lock
          cp web/package-lock.json release/web-package-lock.json
          cd release
          sha256sum \
            Instant-Local-Stream-windows-x86_64.zip \
            Instant-Local-Stream-linux-x86_64.AppImage \
            Instant-Local-Stream-windows-x86_64.ffmpeg.txt \
            Instant-Local-Stream-linux-x86_64.ffmpeg.txt \
            FFMPEG-LICENSE-windows-x86_64.txt \
            FFMPEG-LICENSE-linux-x86_64.txt \
            FFMPEG_SOURCE_OFFER.md \
            THIRD_PARTY_NOTICES.md \
            THIRD_PARTY_LICENSES-RUST.txt \
            THIRD_PARTY_LICENSES-NPM.txt \
            LICENSE \
            Cargo.lock \
            web-package-lock.json \
            > SHA256SUMS.txt

      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_files=(
            release/Instant-Local-Stream-windows-x86_64.zip
            release/Instant-Local-Stream-linux-x86_64.AppImage
            release/Instant-Local-Stream-windows-x86_64.ffmpeg.txt
            release/Instant-Local-Stream-linux-x86_64.ffmpeg.txt
            release/FFMPEG-LICENSE-windows-x86_64.txt
            release/FFMPEG-LICENSE-linux-x86_64.txt
            release/FFMPEG_SOURCE_OFFER.md
            release/THIRD_PARTY_NOTICES.md
            release/THIRD_PARTY_LICENSES-RUST.txt
            release/THIRD_PARTY_LICENSES-NPM.txt
            release/LICENSE
            release/Cargo.lock
            release/web-package-lock.json
            release/SHA256SUMS.txt
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true"
            gh release edit "$GITHUB_REF_NAME" \
              --title "Instant Local Stream $GITHUB_REF_NAME" \
              --notes-file packaging/RELEASE_NOTES_v1.0.0.md
            for file in "${release_files[@]}"; do
              asset="$(basename "$file")"
              if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
              fi
            done
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
              --verify-tag \
              --draft \
              --notes-file packaging/RELEASE_NOTES_v1.0.0.md \
              --title "Instant Local Stream $GITHUB_REF_NAME"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
