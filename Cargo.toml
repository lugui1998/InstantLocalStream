[package]
name = "instant-local-stream"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Portable low-latency local screen streaming host"
default-run = "instant-local-stream"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
eframe = { version = "0.36", default-features = true }
futures-util = "0.3"
flexaudio = "0.2"
mime_guess = "2"
png = "0.18"
opus-rs = "0.1.29"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rtc = "0.20.3"
rust-embed = "8"
socketioxide = { version = "0.18.7", features = ["extensions", "state", "tracing"] }
xcap = "0.9.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
webrtc = { path = "vendor/webrtc" }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
